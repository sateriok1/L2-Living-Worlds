# Gear Grimoire module
# Master on/off switch. With this False the module does nothing and the server is stock.
# Set it to True and restart to turn it on.
Enabled = False

# What this does: adds a "Gear Grimoire" button to the Community Board (Alt+B) and the voiced command  .gg [name]
# Browse armor sets, weapons and jewelry by grade, armor type and role, best first, and open any piece to see where it
# comes from (shop, exchange and what the exchange needs, craft, drops, quests).

# The button label on the board.
TabLabel = Gear Grimoire

# The gear index the book reads. It is made from the datapack by tools/combat_sim/gear_index.py and ships in the
# module's data folder. Relative paths are inside the module folder; leave as is unless you moved it.
IndexFile = data/gear_index.tsv

# Rows per page in lists (3-12).
PageSize = 8
