# ---------------------------------------------------------------------------
# Fake players
# ---------------------------------------------------------------------------
# Our fake player system uses the existing NPC system, allowing fake players
# to function seamlessly like NPCs with minimal impact on server performance.

# Enable fake players.
EnableFakePlayers = True

# Enable chatting with fake players.
FakePlayerChat = True

# Enable autonomous movement/behavior (wander, patrol) for fake players.
# Requires data/FakePlayerBehavior.xml. Route-driven fake players (Routes.xml) are left untouched.
FakePlayerBehavior = True

# Fallback procedural spawn count, ONLY used when data/FakePlayerBehavior.xml defines no
# <population> groups. With populations defined (the default), this value is ignored and the
# populations control where and how many bots spawn. Requires FakePlayerBehavior.
FakePlayerDeployCount = 0

# Base NPC template id used for all procedurally generated bots. Their name, race, gender,
# class, hair and colors are overridden per-instance, so one template is enough.
# 0 = auto-pick the first available fake player template.
FakePlayerBaseNpcId = 0

# Enable shots usage for fake players.
FakePlayerUseShots = True

# Reward PvP kills by killing fake players.
FakePlayerKillsRewardPvP = True

# Fake player kills apply karma rules.
FakePlayerUnflaggedKillsKarma = True

# Fake players can be attacked without PvP flagging.
FakePlayerAutoAttackable = False

# Trade meets: a bot that agreed to meet you "reads a scroll" and lands on the meet spot instead of walking.
# The bot walks if it is already close, and recalls if it is far away or stuck.
# Default: False (the bot always walks, as before).
FakePlayerMeetRecall = False

# Seconds the bot spends casting the scroll before it lands.
FakePlayerMeetRecallCastSeconds = 4

# A bot farther than this (in game units) from the meet spot recalls straight away.
FakePlayerMeetRecallMinDistance = 1500

# A walking bot that has made no progress for this many seconds recalls instead of giving up.
FakePlayerMeetRecallStuckSeconds = 15

# Pick the meet landmark (gatekeeper, warehouse, shop) nearest YOU instead of nearest the bot, so both of you mean the same one.
# Only takes effect when FakePlayerMeetRecall = True (the bot lands there instead of walking across the map).
# Default: False (nearest the bot, as before).
FakePlayerMeetNearPlayer = False

# Aggressive AI fake players attack nearby monsters.
FakePlayerAggroMonsters = True

# Aggressive AI fake players attack nearby players.
FakePlayerAggroPlayers = False

# Aggressive AI fake players attack nearby fake players.
FakePlayerAggroFPC = False

# Fake players can drop items when killing monsters.
FakePlayerCanDropItems = True

# Fake players can pickup dropped items.
FakePlayerCanPickup = True

# Credit YOU (the human) for quest kills your partied AI land, so you don't have to
# steal the last hit on every mob. When a recruited party member or personal support
# buddy lands the killing blow, the quest "onKill" is attributed to the phantom's
# owner (the player who recruited it) instead of the phantom. Any per-killer quest
# condition (faction allegiance, level, etc.) is then checked against you, not the AI.
# Only the owner is credited - a second human in the party still earns from their own
# last hits and their own recruits, exactly as in stock L2.
FakePlayerPartyQuestCredit = True

# How close (in game units) you must be to the kill for that credit to apply, so AI
# can't farm quests for you while you idle in town. 0 disables the distance check.
FakePlayerPartyQuestCreditRange = 1500

# Let AI party members (recruited phantoms / support buddies) take their share of party
# XP/SP. By default they are excluded from the split, so YOU keep 100% of the party's
# experience even though the AI is fighting alongside you. Set True for a more "realistic"
# party feel where the AI counts toward the level-based XP split (you keep less, but it
# behaves like a real grouped party). Default: False (you keep all the XP).
FakePlayerPartyExpShare = False

# Let AI party members roll for party loot and take an adena share, like real members.
# By default they are excluded from loot rolls and adena distribution, so drops and adena
# stay with you (this also stops them quietly eating an adena cut they can never spend).
# Set True to have them roll like a normal party member. Default: False (you keep everything).
FakePlayerPartyLootShare = False

# Let recruited party members pick up drops. After a fight, when nothing is attacking the
# party, each member walks to nearby drops and picks them up. The party loot mode decides
# who gets them: Finders keepers leaves items with the phantom (say "return loot" or
# "party return loot" to get them back), Random and By turn hand them to an eligible member
# (only you while FakePlayerPartyLootShare = False), and adena is always split among the
# eligible members. Herbs and cursed weapons are left on the ground. Default: True.
FakePlayerPartyPickup = True

# Recruited combat-party gear quality. When a recruited party spawns, each member has a
# chance to arrive with a modest uniform enchant on its weapon and armor. These control
# that: the percent chance a member is enchanted at all, and the inclusive +min..+max
# range rolled when it is. Raise for better-geared recruits, lower/zero for plainer ones.
# Despite the name, this also applies to field and town hunters (the phantoms you meet
# hunting and the ones that fight you in PvP), friend regulars, and Olympiad nobles.
# Support buddies and Living Population bots are not enchanted by it.
# Defaults: 100% chance, +0 to +3 (every geared phantom rolls an even +0, +1, +2 or +3).
FakePlayerRecruitEnchantChance = 100
FakePlayerRecruitEnchantMin = 0
FakePlayerRecruitEnchantMax = 3

# Additively load auto-generated field-hunter zones from data/PhantomPopulations.generated.xml
# (produced by tools/build_populations.py) alongside your hand-authored data/PhantomPopulations.xml.
# The generated file is parsed AFTER the authored one, so your hand-authored buddies, regulars, and
# crafted friends are always kept - the generated set only ADDS plain field-hunter zones derived from
# the server's own spawn data. Each generated zone stays dormant until a real player approaches, so a
# world-wide set costs nothing at idle. When False only PhantomPopulations.xml is loaded.
# Workflow: run tools/build_populations.py to (re)generate the side file, review it in tools/fpc-editor,
# then keep this True. If True but the side file is missing, the server logs a hint and loads the
# authored set only. Default: True.
PhantomAutoHuntingZones = True

# Give auto-hunt field hunters the same data-driven skill rotations that recruited party members use
# (data/PhantomPlaystyles.xml), instead of leaving all skill casting to the native round-robin AutoUse.
# When True, a field FIGHTER whose class has a generic playstyle hands its offensive casting to the
# playstyle engine (auto-attack, shots and potions stay on AutoUse), so it uses its listed skills at the
# paced, condition-gated moments the engine decides. A class with no generic playstyle, and mage hunters,
# keep today's pure-AutoUse behavior. Recruited parties and buddies are never affected. This is a live
# off-switch: set False to fall straight back to the previous field-hunter behavior without a rebuild.
# Default: True.
PhantomHunterPlaystyles = True

# When True, a phantom whose playstyle has nothing to cast this moment may use one of its own single-target attack
# or debuff skills that the playstyle does not list, picking the strongest it can afford (stronger hits first, MP
# cost counts against). This keeps classes whose list runs thin at high level (dancers, knights) fighting with their
# real kit. Dances, songs, toggles, heals, buffs, area skills, taunts, Sleep, Root and Spoil are never used this way.
# Applies to field hunters, Olympiad nobles and party members. Default: True.
PhantomSkillFallback = True

# ---------------------------------------------------------------------------
# Fake player ambient chatter
# ---------------------------------------------------------------------------
# How often idle fake players start chatter on their own, with nobody prompting them,
# and how much public chat they are allowed per minute. These shape the "living town"
# feel: lower the intervals for a busier world, raise them for a calmer one.
#
# DISCLAIMER: these are only the server-side timers. How fast and how much the bots
# actually talk ALSO depends on your LLM model and your PC. A larger or slower model,
# or a slower machine, takes longer to produce each line, and lines the safety pass
# drops never reach chat, so the real cadence can be slower than the numbers below
# even when they are set low. If chat still feels slow after lowering these, a smaller
# and faster model or better hardware helps more than lowering these further.

# Seconds between spontaneous TRADE-channel lines. Each tick, one random nearby bot
# posts a trade-ish line on the global trade channel. Lower = more frequent. Default 90
# (about every 1.5 minutes). The actual gap is jittered around this value (roughly 0.6x
# to 1.4x) so posts do not land on a fixed beat. Read when the server starts, so a change
# takes effect after a restart, not on //reload config.
FakePlayerAmbientTradeIntervalSeconds = 90

# Seconds between spontaneous SHOUT lines. Each tick, one random bot posts chit-chat or
# a looking-for-party / LFM ad on the global shout channel. Lower = more frequent.
# Default 120 (about every 2 minutes). The actual gap is jittered around this value so
# shouts do not fire in lockstep. Read at startup, so a change takes effect after a
# restart, not on //reload config.
FakePlayerAmbientShoutIntervalSeconds = 120

# Shared cap on how many PUBLIC fake-player chat lines may go out per minute across ALL
# public channels together (shout, trade, say, and the two ambient timers above). Once
# the cap is reached the extra lines are skipped until the next minute. Raise it if you
# push the intervals very low and want a busier town; lower it to keep chat calmer.
# Default 8. This one is read live, so //reload config applies it without a restart.
FakePlayerMaxPublicChatsPerMinute = 8

# How many times bots may bounce a line off each other before the back-and-forth stops.
# A human line (or an ambient seed) is answered by a bot, that answer can be picked up by
# one more bot, and so on up to this many hops. Higher = longer bot-to-bot threads (and
# more risk of them talking in circles); 0 = bots never reply to other bots, only to real
# players and ambient seeds. Default 2. Read live, so //reload config applies it.
FakePlayerBotChatChainDepth = 2

# Percent chance a bot answers ANOTHER bot's public line (a real player is answered on a
# separate, higher chance). Lower this to thin out bot-to-bot chatter without silencing it
# entirely; raise it for a busier back-and-forth. 0-100. Default 15. Read live, so
# //reload config applies it.
FakePlayerBotChatReplyChance = 15

# ---------------------------------------------------------------------------------------------
# PvP danger encounters. Phantoms come for you in the field and fight ONE fight: they fight until you die or they
# die, then they leave. Never in town or peace zones, never in a duel, instance, siege, or the Olympiad.
# Needs PhantomPvpEnabled = True.
#
# Kinds, easiest first:
#   Wimp      a couple of levels under you; walks up, asks "are you a bot?", then attacks.
#   Normie    your level; attacks while you stand still or fight a monster.
#   Hard      a few levels over you, +3-4 gear; picks its moment like a Normie.
#   Horsemen  a group, well over you, +5-7 gear; attacks the moment it reaches you.
#   Pker      ONE phantom (named below) far over you with a full +16 set; the extinction event.
# Wimp, Normie, Hard and Horsemen send as many phantoms as you have party members. Horsemen never send fewer
# than PhantomEncounterHorsemenMinSize. Pker is always one.
# ---------------------------------------------------------------------------------------------

# Master switch. Default: False.
PhantomEncounters = False

# Players below this level are never targeted at all (each kind also has its own unlock level below).
PhantomEncounterMinPlayerLevel = 10

# After any encounter starts, no other kind can start for this many minutes (so due kinds never pile up).
PhantomEncounterGapMinutes = 5

# Most encounters running at once across the whole server (a whole group counts as one).
PhantomEncounterMaxActive = 2

# Most phantoms in one encounter, however big your party is.
PhantomEncounterMaxActors = 9

# The Horsemen send at least this many phantoms, even when you are alone.
PhantomEncounterHorsemenMinSize = 4

# The lone Pker's name.
PhantomEncounterPkerName = AssMuncher

# Per kind. MinMinutes/MaxMinutes = each kind has its own timer per player: after one of that kind, you wait a
# random time between these (minutes) for the next. 0 turns the kind off. If two are due at once, the rarer
# comes first. MinPlayerLevel = your level at which it unlocks.
# LevelMin/LevelMax = the phantom's level compared with yours (-3 = three under, 6 = six over).
# EnchantMin/EnchantMax = the +level on its weapon and armor.
# AdenaReward = flat adena paid straight to you once, when the whole group is down (0 = none). Works with or
# without gear drops (LootPercent).
# LootPercent = chance that wiping out the whole group drops ONE piece of gear (all 0 by default: adena only) (a random equipped weapon or armor
# piece of the last phantom to die). Nothing else ever drops from them.
PhantomEncounterWimpMinMinutes = 30
PhantomEncounterWimpMaxMinutes = 40
PhantomEncounterWimpMinPlayerLevel = 10
PhantomEncounterWimpLevelMin = -3
PhantomEncounterWimpLevelMax = -2
PhantomEncounterWimpEnchantMin = 0
PhantomEncounterWimpEnchantMax = 0
PhantomEncounterWimpLootPercent = 0
PhantomEncounterWimpAdenaReward = 100000

PhantomEncounterNormieMinMinutes = 30
PhantomEncounterNormieMaxMinutes = 40
PhantomEncounterNormieMinPlayerLevel = 10
PhantomEncounterNormieLevelMin = 0
PhantomEncounterNormieLevelMax = 0
PhantomEncounterNormieEnchantMin = 0
PhantomEncounterNormieEnchantMax = 3
PhantomEncounterNormieLootPercent = 0
PhantomEncounterNormieAdenaReward = 250000

PhantomEncounterHardMinMinutes = 120
PhantomEncounterHardMaxMinutes = 180
PhantomEncounterHardMinPlayerLevel = 20
PhantomEncounterHardLevelMin = 3
PhantomEncounterHardLevelMax = 3
PhantomEncounterHardEnchantMin = 3
PhantomEncounterHardEnchantMax = 4
PhantomEncounterHardLootPercent = 0
PhantomEncounterHardAdenaReward = 500000

PhantomEncounterHorsemenMinMinutes = 270
PhantomEncounterHorsemenMaxMinutes = 330
PhantomEncounterHorsemenMinPlayerLevel = 20
PhantomEncounterHorsemenLevelMin = 5
PhantomEncounterHorsemenLevelMax = 5
PhantomEncounterHorsemenEnchantMin = 5
PhantomEncounterHorsemenEnchantMax = 7
PhantomEncounterHorsemenLootPercent = 0
PhantomEncounterHorsemenAdenaReward = 1500000

PhantomEncounterPkerMinMinutes = 420
PhantomEncounterPkerMaxMinutes = 540
PhantomEncounterPkerMinPlayerLevel = 20
PhantomEncounterPkerLevelMin = 11
PhantomEncounterPkerLevelMax = 11
PhantomEncounterPkerEnchantMin = 16
PhantomEncounterPkerEnchantMax = 16
PhantomEncounterPkerLootPercent = 0
PhantomEncounterPkerAdenaReward = 5000000

# Seconds an encounter phantom spends walking up to you before it gives up and leaves.
PhantomEncounterApproachSeconds = 60

# Longest a single fight can last, in seconds, before the phantoms leave.
PhantomEncounterFightSeconds = 240

# Wimp: seconds between asking "are you a bot?" and attacking.
PhantomEncounterWarnSeconds = 7

# Normie and Hard: seconds you must stand still before they strike (they also strike at once if you are fighting a monster).
PhantomEncounterStillSeconds = 4

# ---------------------------------------------------------------------------------------------
# WTS / WTB trade chat reliability. Every switch below can be set to False for the old behaviour.
# ---------------------------------------------------------------------------------------------

# Read trade ads with the newer parser: whole-word WTS/WTB/selling/buying/S>/B> anywhere in the line
# (so "ssd wtb" and "[WTS] ssd" work, and a word like "unselling" does not).
TradeAdParserV2 = True

# When you link an item from your inventory in the ad, use that exact item (id, enchant, stack size)
# and skip the name search. The item must be in your inventory.
TradeAdLinkedItems = True

# Instead of staying silent, a nearby bot says why it cannot deal (cap hit, nobody free, nothing stocked).
TradeAdStatusReplies = True

# If the item in the ad is not recognised, a bot replies with an example of a working ad.
TradeAdFormatHint = True

# Offer caps per minute: across the whole world, and per player. The old fixed cap was 20 total.
TradeAdOffersPerMinute = 60
TradeAdOffersPerPlayerPerMinute = 4

# Delay before a bot answers an ad (milliseconds, random between the two). Was 5000-15000.
TradeAdReplyMinMs = 3000
TradeAdReplyMaxMs = 7000

# When an item name matches several items equally well, the bot asks which one you meant instead of guessing.
TradeAdClarify = True

# Items per ad ("wts ssd, bsoe, spirit ore"), 1-3. Each item gets its own bot. 1 = single item only.
TradeAdMaxItems = 3

# Price enchanted weapons/armor higher (by grade and enchant level). Off = enchant ignored in pricing.
TradeAdEnchantPricing = True

# How long a bot holds an offer open waiting for you to answer, in seconds. Was 420 (7 minutes).
TradeOfferTimeoutSeconds = 180

# Let auto-hunt field hunters retaliate: if a monster starts attacking a hunter while it is ignoring that
# monster (typically an add that jumps the hunter as it runs to a target it has not engaged yet), the
# hunter turns to deal with the attacker. It does NOT flip targets once it is already trading blows with a
# mob - a second monster also hitting it is left alone until the current one is dealt with, so two attackers
# never ping-pong the hunter back and forth. Switching is further damped: it only takes an attacker no other
# phantom already owns, never abandons a target that is almost dead, and waits out a short per-phantom
# cooldown. All switches go through the same claim/deconflict rules as normal hunting, so multi-phantom mob
# spread and deference to real players are preserved. Set False to keep hunters on their first target.
# Default: True.
PhantomHunterRetaliate = True


# ---------------------------------------------------------------------------
# Phantom PvP
# ---------------------------------------------------------------------------
# Player-versus-phantom and phantom-versus-phantom combat. Only field phantoms (real Player-based bots) and
# the real player are ever combatants; NPC-based fake players (the town crowd) are never involved, and town
# and other peace zones are always safe. Field phantoms are real Player objects, so the stock PvP flag,
# karma / PK, and duel systems apply to them natively. See docs/PVP_SYSTEM_DESIGN.md for the full design.

# Master switch for all phantom PvP (versus the player and versus other phantoms). When False every behavior
# below is off and the PvP layer costs nothing. Default: True.
PhantomPvpEnabled = True

# Individual behaviors. Each only takes effect when PhantomPvpEnabled = True.
# A phantom fights back (or flees when outmatched) when it is attacked. This is the foundation behavior and
# also covers a phantom defending itself against another phantom. Default: True.
PhantomPvpSelfDefense = True
# A phantom may engage a player or phantom that is already PvP-flagged (purple) or a red PK. Default: True.
PhantomPvpReactToFlagged = True
# A phantom answers, and occasionally issues, formal duels through the stock duel system. Challenge an idle
# phantom and it accepts or declines after a moment, depending on its honor and the level gap (your own recruits,
# buddies and befriended regulars always spar with you). An honorable idle phantom may also challenge you, or
# another phantom while you are nearby to watch. Duels never cost karma or items. Default: True.
PhantomPvpDuels = True
# Allies (recruited party members, buddies, friends) turn on a hostile that attacks their owner or a party
# member. They never start a fight with their own owner or a fellow member. A member tied up on a raid boss holds
# its ground (it still defends itself, but does not peel to defend others). Default: True.
PhantomPvpPartyDefense = True
# Extend that defense to clan and alliance members, not only the party: a phantom also helps a clanmate or
# allymate under attack, bounded by PhantomPvpDefendRadius. Default: True.
PhantomPvpClanDefense = True
# How close (game units) a protected ally must be for a phantom to rush to its defense. Bounds a defense to nearby
# allies so a large spread-out clan never turns one skirmish into a server-wide brawl. Default: 1200.
PhantomPvpDefendRadius = 1200
# Phantoms may also fight each other, not only the player. Bounded participants and long cooldowns keep this
# from becoming a mass brawl. Default: True.
PhantomPvpBetweenPhantoms = True
# A hostile field phantom may START PvP on an unflagged player (or phantom) in the open field. Never in town,
# never in a newbie zone, never against a newbie-protected low level. Most aggressive behavior. RESERVED: not yet
# wired (lands in Phase 4); this switch has no effect until then. Default: False.
PhantomPvpOpenWorldGank = False

# Consequences. A phantom is a real player, so the stock karma-based drop-on-death rules already fire on it with no
# custom code: True is that native retail behavior (only a phantom carrying karma rolls a drop). The False path
# (actively SUPPRESS a phantom's drop regardless of karma) is RESERVED and not yet wired (lands in Phase 4), so
# setting False currently still follows retail. The real player's own drop risk is never changed by this key.
# Default: True.
PhantomPvpDeathDrops = True

# Tuning.
# A phantom this many levels over its target will not INITIATE PvP against it (self-defense is unaffected).
PhantomPvpMaxLevelGapAbovePlayer = 6
# Share of phantoms, as a percentage, rolled with an aggressor personality (candidates for PK-reaction and
# ganking). The rest are non-aggressors that only ever defend themselves or their party.
PhantomPvpAggressorPercent = 15
# Chance, as a percentage, that an eligible aggressor phantom actually engages a flagged (purple) or red (PK)
# target it notices (PhantomPvpReactToFlagged). Rolled once per consideration, so reacting is occasional rather
# than automatic: 0 means it never reacts, 100 means it always does. A declined or successful decision then waits
# out PhantomPvpEngageCooldownSeconds before the phantom reconsiders. A phantom never reacts to a clan or ally
# member, a newbie-protected low level, anyone in town, or a target outside its level band.
PhantomPvpReactChancePercent = 25
# Cooldown in seconds, per attacker and per target, before the same phantom starts PvP on the same target
# again, so a player is never farmed or hounded by the same bot.
PhantomPvpEngageCooldownSeconds = 300
# Chance, as a percentage, that an eligible idle phantom issues a duel when the situation allows one. A phantom
# considers it at most every 30 seconds, then waits 10 minutes after a challenge, and the same opponent is not
# challenged again for 5 minutes.
PhantomPvpDuelChancePercent = 10
# Default HP percent at which a phantom breaks off and flees. A per-phantom bravery trait shifts this up or
# down, so a timid phantom flees earlier and a brave one later.
PhantomPvpFleeHpPercent = 30
# An archer phantom with a bow steps back to shooting range when a melee player closes in on it during PvP (a fight,
# a duel or an Olympiad match), at most once every few seconds. It never kites in town, and a party member never runs
# far from its leader. Default: True.
PhantomArcherKiting = True
