name: Native module combat accounting tests

on:
  pull_request:
    paths:
      - "L2J_Mobius_CT_0_Interlude github/java/**"
      - "L2J_Mobius_CT_0_Interlude github/dist/libs/**"
      - "L2J_Mobius_CT_0_Interlude github/build.xml"
      - "L2J_Mobius_CT_0_Interlude github/dist/game/data/scripts/handlers/skill/effects/Heal.java"
      - "L2J_Mobius_CT_0_Interlude github/dist/game/data/scripts/handlers/skill/effects/HealPercent.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/ModuleDamageTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_module_damage.py"
      - ".github/workflows/module-damage-tests.yml"
  push:
    branches:
      - main
      - release/module-damage-accounting
    paths:
      - "L2J_Mobius_CT_0_Interlude github/java/**"
      - "L2J_Mobius_CT_0_Interlude github/dist/libs/**"
      - "L2J_Mobius_CT_0_Interlude github/build.xml"
      - "L2J_Mobius_CT_0_Interlude github/dist/game/data/scripts/handlers/skill/effects/Heal.java"
      - "L2J_Mobius_CT_0_Interlude github/dist/game/data/scripts/handlers/skill/effects/HealPercent.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/ModuleDamageTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_module_damage.py"
      - ".github/workflows/module-damage-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-module-damage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "L2J_Mobius_CT_0_Interlude github"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant
      - name: Build the game core
        run: |
          java -version
          ant -version
          ant -Dbuild="../build/module-damage" jar
      - name: Run native module combat accounting regressions
        run: python tests/run_module_damage.py --core "../build/module-damage/dist/libs/GameServer.jar"
