name: Native party defense tests

on:
  pull_request:
    paths:
      - "L2J_Mobius_CT_0_Interlude github/java/**"
      - "L2J_Mobius_CT_0_Interlude github/dist/libs/**"
      - "L2J_Mobius_CT_0_Interlude github/build.xml"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/PhantomPartyDefenseTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/party-defense-stubs/**"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_party_defense.py"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/PhantomSpotIntegrationTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/spot-stubs/**"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_phantom_spot.py"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/PhantomPreparationIntegrationTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/preparation-stubs/**"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/encounter-stubs/org/l2jmobius/gameserver/geoengine/**"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_phantom_preparation.py"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/ModuleTeamsTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_module_teams.py"
      - ".github/workflows/party-defense-tests.yml"
  push:
    branches:
      - main
      - release/party-mob-defense
      - release/spot-defense-fixes
      - fix/encounter-preparation
      - release/team-engine
    paths:
      - "L2J_Mobius_CT_0_Interlude github/java/**"
      - "L2J_Mobius_CT_0_Interlude github/dist/libs/**"
      - "L2J_Mobius_CT_0_Interlude github/build.xml"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/PhantomPartyDefenseTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/party-defense-stubs/**"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_party_defense.py"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/PhantomSpotIntegrationTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/spot-stubs/**"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_phantom_spot.py"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/PhantomPreparationIntegrationTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/preparation-stubs/**"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/encounter-stubs/org/l2jmobius/gameserver/geoengine/**"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_phantom_preparation.py"
      - "L2J_Mobius_CT_0_Interlude github/tests/core/ModuleTeamsTest.java"
      - "L2J_Mobius_CT_0_Interlude github/tests/run_module_teams.py"
      - ".github/workflows/party-defense-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-party-defense:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: "L2J_Mobius_CT_0_Interlude github"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install --yes ant
      - name: Build the game core
        run: |
          java -version
          ant -version
          ant -Dbuild="../build/party-defense" jar
      - name: Run native party-defense regressions
        run: python tests/run_party_defense.py --core "../build/party-defense/dist/libs/GameServer.jar"
      - name: Run native hunting-spot regressions
        run: python tests/run_phantom_spot.py --core "../build/party-defense/dist/libs/GameServer.jar"
      - name: Run native encounter-preparation regressions
        run: python tests/run_phantom_preparation.py --core "../build/party-defense/dist/libs/GameServer.jar"
      - name: Run native team-event regressions
        run: python tests/run_module_teams.py --core "../build/party-defense/dist/libs/GameServer.jar"
